<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Pets | Smart Pet Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #f0f2f7;
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
            --color-danger: #ef4444;
            --color-text: #0f172a;
            --color-text-secondary: #475569;
            --color-text-muted: #94a3b8;
            --glass-bg: rgba(255,255,255,0.55);
            --glass-border: rgba(255,255,255,0.7);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--color-bg);
            min-height: 100vh; padding: 2rem 1.5rem 4rem;
            color: var(--color-text);
            letter-spacing: -0.011em; position: relative;
        }
        .bg-orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            filter: blur(80px); opacity: 0.3;
        }
        .bg-orb-1 { width: 400px; height: 400px; background: rgba(99,102,241,0.07); top: -100px; right: -80px; animation: orb1 20s ease-in-out infinite; }
        .bg-orb-2 { width: 350px; height: 350px; background: rgba(249,115,22,0.04); bottom: -80px; left: -60px; animation: orb2 24s ease-in-out infinite; }
        @keyframes orb1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,30px) scale(1.06);} }
        @keyframes orb2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,-25px) scale(1.05);} }

        .container { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;
            padding: 0.9rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            box-shadow: var(--glass-shadow);
        }
        .header .brand { display: flex; align-items: center; gap: 0.7rem; }
        .header .brand-icon {
            width: 2.5rem; height: 2.5rem;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: white; border-radius: 0.75rem;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.1rem; box-shadow: 0 6px 18px rgba(99,102,241,0.25);
        }
        .header h1 {
            font-size: 1.25rem; font-weight: 700;
            background: linear-gradient(135deg, #1e1b4b, #4338ca);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        .btn {
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.8rem;
            padding: 0.5rem 1.1rem; border-radius: 0.7rem; border: none; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.4rem;
            transition: all 0.15s; text-decoration: none;
        }
        .btn-back { background: #475569; color: white; }
        .btn-back:hover { background: #334155; transform: translateY(-1px); }
        .btn-edit {
            background: var(--color-primary); color: white;
            box-shadow: 0 3px 12px rgba(99,102,241,0.2);
        }
        .btn-edit:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
        .btn-delete {
            background: white; color: var(--color-danger);
            border: 1.5px solid #fecaca;
        }
        .btn-delete:hover { background: #fef2f2; transform: translateY(-1px); }

        /* Pet card */
        .pet-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            padding: 1.1rem 1.4rem;
            margin-bottom: 0.65rem;
            box-shadow: var(--glass-shadow);
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 0.8rem;
            transition: all 0.2s;
        }
        .pet-card:hover { transform: translateY(-1px); box-shadow: 0 12px 36px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.05); }
        .pet-info .pet-name {
            font-weight: 700; font-size: 0.95rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .pet-info .pet-meta { font-size: 0.76rem; color: var(--color-text-muted); margin-top: 0.15rem; }
        .badge {
            font-size: 0.6rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em;
            padding: 0.15rem 0.5rem; border-radius: 1rem;
        }
        .badge-demo { background: #e0e7ff; color: #3730a3; }
        .badge-custom { background: #fef3c7; color: #92400e; }
        .pet-actions { display: flex; gap: 0.45rem; flex-shrink: 0; }
        .device-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; font-size: 0.85rem; }
        .device-item input { width: auto; margin: 0; accent-color: var(--color-primary); }
        .empty-state {
            text-align: center; padding: 3.5rem 1rem; color: var(--color-text-muted);
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; opacity: 0.3; }

        /* ── Polished Modal ── */
        .modal {
            display: none; position: fixed; z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            align-items: center; justify-content: center;
        }
        .modal-panel {
            background: white; border-radius: 1.5rem;
            max-width: 480px; width: 90%; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .modal-panel .panel-head {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4f46e5 100%);
            color: white; padding: 1.5rem 2rem; text-align: center;
        }
        .panel-head .head-icon {
            width: 2.8rem; height: 2.8rem; border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.2rem; margin-bottom: 0.6rem;
        }
        .panel-head h3 { font-size: 1.15rem; font-weight: 700; color: white; }
        .panel-head.danger {
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #dc2626 100%);
        }
        .modal-panel .panel-body { padding: 1.5rem 2rem; }
        .modal-panel label {
            display: flex; align-items: center; gap: 0.5rem;
            font-weight: 600; font-size: 0.8rem;
            margin: 0.9rem 0 0.3rem; color: #334155;
        }
        .modal-panel label:first-child { margin-top: 0; }
        .modal-panel label .lbl-icon {
            width: 1.5rem; height: 1.5rem; border-radius: 5px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.7rem; flex-shrink: 0;
        }
        .modal-panel input, .modal-panel select {
            width: 100%; padding: 0.6rem 0.8rem;
            border: 1.5px solid #d1d5db; border-radius: 0.6rem;
            font-family: 'Inter', sans-serif; font-size: 0.88rem;
            transition: border-color 0.15s, box-shadow 0.15s; background: #f9fafb;
        }
        .modal-panel input:focus, .modal-panel select:focus {
            outline: none; border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.10); background: white;
        }
        .modal-panel .panel-actions {
            display: flex; justify-content: flex-end; gap: 0.6rem;
            padding: 1rem 2rem 1.5rem; border-top: 1px solid #f0f1f4;
        }
        .btn-cancel { background: #e5e7eb; color: #374151; }
        .btn-cancel:hover { background: #d1d5db; }
        .btn-save { background: var(--color-primary); color: white; box-shadow: 0 3px 12px rgba(99,102,241,0.2); }
        .btn-save:hover { background: var(--color-primary-hover); }
        .btn-danger-confirm { background: var(--color-danger); color: white; }
        .btn-danger-confirm:hover { background: #b91c1c; }

        .delete-warning {
            background: #fef2f2; color: #991b1b;
            padding: 0.75rem 1rem; border-radius: 0.65rem;
            font-size: 0.82rem; margin-top: 0.75rem;
            display: flex; align-items: center; gap: 0.5rem;
        }

        /* Toast */
        .toast-container { position: fixed; top: 1.25rem; right: 1.25rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
        .toast {
            background: #1e1b4b; color: white; padding: 0.8rem 1.2rem; border-radius: 0.75rem;
            font-family: 'Inter', sans-serif; font-size: 0.84rem; font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 0.55rem;
            animation: toastIn 0.25s ease-out, toastOut 0.25s ease-in forwards;
            animation-delay: 0s, 2.5s; pointer-events: auto; max-width: 380px;
        }
        .toast.success { border-left: 3px solid #22c55e; }
        .toast.error { border-left: 3px solid #ef4444; }
        .toast.info { border-left: 3px solid #6366f1; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(60px); } }
    </style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="container">
    <div class="header">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-users-cog"></i></div>
            <h1>Manage Pets</h1>
        </div>
        <a href="/dashboard" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
    <div id="petsList"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-panel">
        <div class="panel-head">
            <div class="head-icon"><i class="fas fa-pen"></i></div>
            <h3 id="editModalTitle">Edit Pet Details</h3>
        </div>
        <div class="panel-body">
            <input type="hidden" id="editPetId">
            <input type="hidden" id="editPetType">
            <label><span class="lbl-icon" style="background:#f5f3ff;color:#7c3aed;"><i class="fas fa-tag"></i></span> Pet Name</label>
            <input type="text" id="editPetName" placeholder="Enter pet name">
            <label><span class="lbl-icon" style="background:#fef3c7;color:#d97706;"><i class="fas fa-paw"></i></span> Species</label>
            <select id="editPetSpecies">
                <option value="Cat">Cat</option>
                <option value="Dog">Dog</option>
                <option value="Other">Other</option>
            </select>
            <label><span class="lbl-icon" style="background:#fef2f2;color:#ea580c;"><i class="fas fa-temperature-high"></i></span> Temperature Threshold (°C)</label>
            <input type="number" id="editPetTemp" step="0.1" min="0" max="60">
            <label><span class="lbl-icon" style="background:#f0f9ff;color:#0284c7;"><i class="fas fa-tint"></i></span> Humidity Threshold (%)</label>
            <input type="number" id="editPetHumi" step="0.1" min="0" max="100">

            <!-- Device re-assignment (Own Pet only) -->
            <div id="editDeviceSection" style="display:none;">
                <div style="border-top:1px solid #e5e7eb;margin:1rem 0;"></div>
                <label><span class="lbl-icon" style="background:#fef2f2;color:#dc2626;"><i class="fas fa-microchip"></i></span> Temperature / Humidity Sensor</label>
                <div id="editSensorList"></div>
                <p style="font-size:0.7rem;color:#6b7280;margin-top:2px;">Re-assign the DHT22 sensor for this pet.</p>
                <label><span class="lbl-icon" style="background:#f0f9ff;color:#2563eb;"><i class="fas fa-video"></i></span> Camera</label>
                <div id="editCameraList"></div>
                <p style="font-size:0.7rem;color:#6b7280;margin-top:2px;">Re-assign the USB camera for this pet.</p>
            </div>
        </div>
        <div class="panel-actions">
            <button class="btn btn-cancel" onclick="closeEditModal()"><i class="fas fa-times"></i> Cancel</button>
            <button class="btn btn-save" onclick="saveEdit()"><i class="fas fa-check"></i> Save Changes</button>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
    <div class="modal-panel">
        <div class="panel-head danger">
            <div class="head-icon"><i class="fas fa-triangle-exclamation"></i></div>
            <h3>Delete Pet Permanently</h3>
        </div>
        <div class="panel-body">
            <input type="hidden" id="deletePetId">
            <p style="color:#475569;font-size:0.9rem;line-height:1.5;">
                Are you sure you want to permanently delete <strong id="deletePetName" style="color:#dc2626;"></strong>?
            </p>
            <div class="delete-warning">
                <i class="fas fa-exclamation-circle"></i>
                All sensor history and alert records will be permanently removed. This cannot be undone.
            </div>
        </div>
        <div class="panel-actions">
            <button class="btn btn-cancel" onclick="closeDeleteModal()"><i class="fas fa-times"></i> Cancel</button>
            <button class="btn btn-danger-confirm" onclick="confirmDelete()"><i class="fas fa-trash"></i> Delete Permanently</button>
        </div>
    </div>
</div>

<script>
    function showToast(message, type) {
        type = type || 'info';
        const container = document.getElementById('toastContainer');
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${message}`;
        container.appendChild(toast);
        setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
    }

    let currentEditPet = null;

    async function loadDevicesForEdit(selectedSensorId, selectedCameraId) {
        try {
            const res = await fetch('/api/devices');
            const devices = await res.json();
            const sensors = devices.filter(d => d.type === 'temp_humi');
            const cameras = devices.filter(d => d.type === 'camera');

            const sc = document.getElementById('editSensorList'); sc.innerHTML = '';
            sensors.forEach(s => {
                const checked = s.id === selectedSensorId ? ' checked' : '';
                sc.innerHTML += `<div class="device-item"><input type="radio" name="editSensor" value="${s.id}"${checked}> ${s.name}</div>`;
            });

            const cc = document.getElementById('editCameraList'); cc.innerHTML = '';
            cameras.forEach(c => {
                const checked = c.id === selectedCameraId ? ' checked' : '';
                cc.innerHTML += `<div class="device-item"><input type="radio" name="editCamera" value="${c.id}"${checked}> ${c.name}</div>`;
            });
        } catch (e) { /* ignore */ }
    }

    function openEditModal(pet) {
        currentEditPet = pet;
        document.getElementById('editPetId').value = pet.id;
        document.getElementById('editPetType').value = pet.type || 'default';
        document.getElementById('editPetName').value = pet.name;
        document.getElementById('editPetSpecies').value = pet.species;
        document.getElementById('editPetTemp').value = pet.temp_max;
        document.getElementById('editPetHumi').value = pet.humi_min;

        const deviceSection = document.getElementById('editDeviceSection');
        if (pet.type === 'custom') {
            deviceSection.style.display = '';
            document.getElementById('editModalTitle').textContent = 'Edit Pet — Own Pet Mode';
            loadDevicesForEdit(pet.temp_sensor_id, pet.camera_id);
        } else {
            deviceSection.style.display = 'none';
            document.getElementById('editModalTitle').textContent = 'Edit Pet Details';
        }
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() { document.getElementById('editModal').style.display = 'none'; currentEditPet = null; }

    async function saveEdit() {
        const id = document.getElementById('editPetId').value;
        const name = document.getElementById('editPetName').value.trim();
        if (!name) { showToast('Pet name is required', 'error'); return; }
        const petType = document.getElementById('editPetType').value;
        const payload = {
            name: name, species: document.getElementById('editPetSpecies').value,
            temp_max: parseFloat(document.getElementById('editPetTemp').value),
            humi_min: parseFloat(document.getElementById('editPetHumi').value)
        };
        // Include device re-assignment for Own Pet mode
        if (petType === 'custom') {
            const selSensor = document.querySelector('input[name="editSensor"]:checked');
            const selCamera = document.querySelector('input[name="editCamera"]:checked');
            if (selSensor) payload.temp_sensor_id = parseInt(selSensor.value);
            if (selCamera) payload.camera_id = parseInt(selCamera.value);
        }
        try {
            const res = await fetch(`/api/pets/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (res.ok) { closeEditModal(); showToast('Pet "' + name + '" updated', 'success'); loadPets(); }
            else { const err = await res.json(); showToast(err.error || 'Update failed', 'error'); }
        } catch (e) { showToast('Network error', 'error'); }
    }

    function openDeleteModal(pet) {
        document.getElementById('deletePetId').value = pet.id;
        document.getElementById('deletePetName').textContent = pet.name + ' (' + pet.species + ')';
        document.getElementById('deleteModal').style.display = 'flex';
    }
    function closeDeleteModal() { document.getElementById('deleteModal').style.display = 'none'; }
    async function confirmDelete() {
        const id = document.getElementById('deletePetId').value;
        try {
            const res = await fetch(`/api/pets/${id}`, { method: 'DELETE' });
            if (res.ok) { closeDeleteModal(); showToast('Pet deleted permanently', 'success'); loadPets(); }
            else { const err = await res.json(); showToast(err.error || 'Delete failed', 'error'); }
        } catch (e) { showToast('Network error', 'error'); }
    }

    document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
    document.getElementById('deleteModal').addEventListener('click', function(e) { if (e.target === this) closeDeleteModal(); });

    async function loadPets() {
        try {
            const res = await fetch('/api/pets');
            const pets = await res.json();
            const container = document.getElementById('petsList');
            if (pets.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-paw"></i><p>No pets yet — <a href="/create-pet" style="color:#6366f1;font-weight:600;">create one</a> or <a href="/dashboard" style="color:#6366f1;font-weight:600;">go to dashboard</a>.</p></div>`;
                return;
            }
            container.innerHTML = '';
            for (const pet of pets) {
                const badgeClass = pet.type === 'default' ? 'badge-demo' : 'badge-custom';
                const badgeText = pet.type === 'default' ? 'Demo' : 'Custom';
                let deviceInfo = '';
                if (pet.type === 'custom') {
                    deviceInfo = ` &middot; <i class="fas fa-microchip"></i> Sensor #${pet.temp_sensor_id || '?'} &middot; <i class="fas fa-video"></i> Cam #${pet.camera_id || '?'}`;
                }
                const div = document.createElement('div');
                div.className = 'pet-card';
                div.innerHTML = `
                    <div class="pet-info">
                        <div class="pet-name">${pet.name} <span class="badge ${badgeClass}">${badgeText}</span></div>
                        <div class="pet-meta">${pet.species} &middot; Temp ≤ ${pet.temp_max}°C &middot; Humi ≥ ${pet.humi_min}%${deviceInfo}</div>
                    </div>
                    <div class="pet-actions">
                        <button class="btn btn-edit"><i class="fas fa-pen"></i> Edit</button>
                        <button class="btn btn-delete"><i class="fas fa-trash"></i> Delete</button>
                    </div>`;
                const editBtn = div.querySelector('.btn-edit');
                const deleteBtn = div.querySelector('.btn-delete');
                editBtn.addEventListener('click', () => openEditModal(pet));
                deleteBtn.addEventListener('click', () => openDeleteModal(pet));
                container.appendChild(div);
            }
        } catch (e) { showToast('Failed to load pet list', 'error'); }
    }

    loadPets();
</script>
</body>
</html>
