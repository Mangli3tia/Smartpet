<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Pet — Smart Pet Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f0f2f7;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
            color: #0f172a;
            position: relative;
            letter-spacing: -0.011em;
        }

        /* Background orbs */
        .bg-orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            filter: blur(80px); opacity: 0.35;
        }
        .bg-orb-1 { width: 400px; height: 400px; background: rgba(99,102,241,0.08); top: -100px; left: -80px; animation: orbFloat1 18s ease-in-out infinite; }
        .bg-orb-2 { width: 350px; height: 350px; background: rgba(14,165,233,0.06); bottom: -80px; right: -60px; animation: orbFloat2 22s ease-in-out infinite; }
        @keyframes orbFloat1 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(40px,-30px) scale(1.07);} 66%{transform:translate(-25px,20px) scale(0.95);} }
        @keyframes orbFloat2 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(-35px,-25px) scale(1.06);} 66%{transform:translate(25px,18px) scale(0.94);} }

        .container {
            position: relative; z-index: 1;
            max-width: 680px; margin: 0 auto;
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
            padding: 2.2rem 2rem;
        }

        /* Header */
        .page-header {
            text-align: center; margin-bottom: 2rem;
        }
        .page-header .header-icon {
            width: 4rem; height: 4rem;
            background: linear-gradient(135deg, #6366f1, #818cf8, #a78bfa);
            border-radius: 1.4rem; display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 1.8rem; color: white;
            box-shadow: 0 12px 32px rgba(99,102,241,0.25);
            margin-bottom: 1rem;
            animation: floatIcon 4s ease-in-out infinite;
        }
        @keyframes floatIcon { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

        h2 {
            font-size: 1.6rem; font-weight: 800;
            background: linear-gradient(135deg, #1e1b4b, #4338ca);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 0.3rem;
        }
        .sub {
            color: #64748b; font-size: 0.88rem; font-weight: 500;
        }

        /* Step indicator */
        .steps-bar {
            display: flex; justify-content: center; gap: 0;
            margin-bottom: 2rem; position: relative;
        }
        .steps-bar::before {
            content: ''; position: absolute; top: 1.15rem; left: 10%; right: 10%;
            height: 2px; background: #e2e8f0; z-index: 0;
        }
        .step-dot {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
            padding: 0 1.2rem;
        }
        .step-dot .dot {
            width: 2.3rem; height: 2.3rem; border-radius: 50%;
            background: white; border: 2px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.8rem; color: #94a3b8;
            transition: all 0.25s;
        }
        .step-dot .dot.active { background: #6366f1; border-color: #6366f1; color: white; box-shadow: 0 4px 16px rgba(99,102,241,0.25); }
        .step-dot .step-label { font-size: 0.68rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
        .step-dot .dot.active + .step-label { color: #6366f1; }

        /* Step sections */
        .step-section {
            margin-bottom: 1.75rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .step-section:last-of-type { border-bottom: none; margin-bottom: 1rem; }

        .step-section h3 {
            font-size: 1rem; font-weight: 700; color: #4f46e5;
            margin-bottom: 1rem; display: flex; align-items: center; gap: 0.55rem;
        }
        .step-section h3 .step-num {
            width: 1.6rem; height: 1.6rem; border-radius: 0.45rem;
            background: rgba(99,102,241,0.1); color: #4f46e5;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 800;
        }

        label {
            display: block; font-weight: 600; font-size: 0.82rem;
            margin-top: 0.9rem; margin-bottom: 0.35rem; color: #334155;
        }
        label:first-child { margin-top: 0; }

        input, select {
            width: 100%; padding: 0.65rem 0.9rem;
            border-radius: 0.7rem; border: 1.5px solid #d1d5db;
            font-family: 'Inter', sans-serif; font-size: 0.88rem;
            transition: all 0.2s; background: #f9fafb;
        }
        input:focus, select:focus {
            outline: none; border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.10); background: white;
        }

        .device-item {
            background: #f8fafc; border-radius: 0.7rem;
            padding: 0.55rem 0.9rem; margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 0.7rem;
            transition: all 0.2s;
        }
        .device-item:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .device-item input { width: auto; margin: 0; flex-shrink: 0; accent-color: #6366f1; }
        .device-name { font-weight: 500; flex: 1; color: #0f172a; }

        .btn {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white; border: none;
            padding: 0.85rem 1.5rem; border-radius: 0.9rem;
            font-weight: 600; font-size: 0.9rem; cursor: pointer;
            width: 100%; transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(99,102,241,0.25);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(99,102,241,0.35); }
        .btn:active { transform: scale(0.98); }

        .message {
            margin-top: 0.9rem; padding: 0.75rem 0.9rem;
            border-radius: 0.7rem; display: none; font-size: 0.82rem; font-weight: 500;
        }
        .success { background: #dcfce7; color: #166534; border-left: 3px solid #22c55e; }
        .error { background: #fee2e2; color: #991b1b; border-left: 3px solid #ef4444; }

        .back-link {
            display: inline-block; margin-top: 0.75rem; text-align: center; width: 100%;
            color: #6366f1; text-decoration: none; font-size: 0.82rem; font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="container">
    <div class="page-header">
        <div class="header-icon">🐱</div>
        <h2>Create New Pet</h2>
        <p class="sub">Bind hardware devices and set custom alert rules</p>
    </div>

    <!-- Step indicator -->
    <div class="steps-bar">
        <div class="step-dot">
            <div class="dot active">1</div>
            <span class="step-label">Info</span>
        </div>
        <div class="step-dot">
            <div class="dot">2</div>
            <span class="step-label">Devices</span>
        </div>
        <div class="step-dot">
            <div class="dot">3</div>
            <span class="step-label">Rules</span>
        </div>
    </div>

    <!-- Step 1: Basic Info -->
    <div class="step-section">
        <h3><span class="step-num">1</span> Basic Information</h3>
        <label>Pet Name</label>
        <input type="text" id="petName" placeholder="e.g., Whiskers, Buddy" autocomplete="off">
        <label>Species</label>
        <select id="petSpecies">
            <option value="Cat">Cat</option>
            <option value="Dog">Dog</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <!-- Step 2: Select Temperature/Humidity Sensor -->
    <div class="step-section">
        <h3><span class="step-num">2</span> Select Temperature / Humidity Sensor</h3>
        <div id="sensorList"></div>
    </div>

    <!-- Step 3: Select Camera -->
    <div class="step-section">
        <h3><span class="step-num">3</span> Select Camera</h3>
        <div id="cameraList"></div>
    </div>

    <!-- Step 4: Custom Alert Rules (Optional) -->
    <div class="step-section">
        <h3><span class="step-num">4</span> Custom Alert Rules (Optional)</h3>
        <label>Temperature threshold (°C) — default 30.0</label>
        <input type="number" step="0.1" id="tempMax" value="30.0">
        <label>Humidity threshold (%) — default 40.0</label>
        <input type="number" step="0.1" id="humiMin" value="40.0">
    </div>

    <button class="btn" id="createBtn"><i class="fas fa-plus-circle"></i> Create Pet & Save</button>
    <div id="message" class="message"></div>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Main Menu</a>
</div>

<script>
    let sensors = [];
    let cameras = [];

    async function loadDevices() {
        try {
            const res = await fetch('/api/devices');
            if (!res.ok) throw new Error('Failed to fetch devices');
            const devices = await res.json();

            sensors = devices.filter(d => d.type === 'temp_humi');
            cameras = devices.filter(d => d.type === 'camera');

            const sensorContainer = document.getElementById('sensorList');
            sensorContainer.innerHTML = '';
            if (sensors.length === 0) {
                sensorContainer.innerHTML = '<div class="device-item">No sensors available.</div>';
            } else {
                sensors.forEach(sensor => {
                    const div = document.createElement('div');
                    div.className = 'device-item';
                    div.innerHTML = `<input type="radio" name="sensorSelect" value="${sensor.id}" id="sensor_${sensor.id}"><label for="sensor_${sensor.id}" class="device-name">${escapeHtml(sensor.name)}</label>`;
                    sensorContainer.appendChild(div);
                });
            }

            const cameraContainer = document.getElementById('cameraList');
            cameraContainer.innerHTML = '';
            if (cameras.length === 0) {
                cameraContainer.innerHTML = '<div class="device-item">No cameras available.</div>';
            } else {
                cameras.forEach(camera => {
                    const div = document.createElement('div');
                    div.className = 'device-item';
                    div.innerHTML = `<input type="radio" name="cameraSelect" value="${camera.id}" id="camera_${camera.id}"><label for="camera_${camera.id}" class="device-name">${escapeHtml(camera.name)}</label>`;
                    cameraContainer.appendChild(div);
                });
            }
        } catch (err) {
            console.error(err);
            document.getElementById('sensorList').innerHTML = '<div class="device-item">Error loading devices.</div>';
            document.getElementById('cameraList').innerHTML = '<div class="device-item">Error loading devices.</div>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = `message ${type}`;
        msgDiv.style.display = 'block';
        setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
    }

    document.getElementById('createBtn').onclick = async () => {
        const name = document.getElementById('petName').value.trim();
        if (!name) { showMessage('Please enter a pet name', 'error'); return; }

        const selectedSensor = document.querySelector('input[name="sensorSelect"]:checked');
        if (!selectedSensor) { showMessage('Please select a temperature/humidity sensor', 'error'); return; }

        const selectedCamera = document.querySelector('input[name="cameraSelect"]:checked');
        if (!selectedCamera) { showMessage('Please select a camera', 'error'); return; }

        const sensorId = parseInt(selectedSensor.value);
        const cameraId = parseInt(selectedCamera.value);
        const species = document.getElementById('petSpecies').value;
        const tempMax = parseFloat(document.getElementById('tempMax').value);
        const humiMin = parseFloat(document.getElementById('humiMin').value);

        const payload = {
            name: name, species: species,
            temp_sensor_id: sensorId, camera_id: cameraId,
            temp_max: tempMax, humi_min: humiMin
        };

        try {
            const res = await fetch('/api/pets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                showMessage(`✅ Pet "${name}" created successfully! Redirecting...`, 'success');
                setTimeout(() => { window.location.href = `/dashboard?pet_id=${data.pet_id}`; }, 1500);
            } else {
                showMessage(`Error: ${data.error || 'Unknown error'}`, 'error');
            }
        } catch (err) {
            console.error(err);
            showMessage('Network error. Please check backend.', 'error');
        }
    };

    loadDevices();
</script>
</body>
</html>
