<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pet Monitor - Welcome</title>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fc 0%, #eef2f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2c3e66, #1a2a44);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border-radius: 3rem;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.2s;
            display: inline-block;
        }
        .btn-primary {
            background: #4f46e5;
            color: white;
            box-shadow: 0 4px 10px rgba(79,70,229,0.3);
        }
        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: white;
            color: #1e293b;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover {
            background: #f8fafc;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🐾 Smart Pet Monitor</h1>
    <p style="color:#4b5563; margin-bottom: 1rem;">Choose an option to continue</p>
    <div class="btn-group">
        <a href="/dashboard" class="btn btn-primary">📊 View Demo (Simulated Pets)</a>
        <a href="/create-pet" class="btn btn-secondary">➕ Create My Own Pet</a>
    </div>
    <div class="footer">Real hardware support coming soon • Data currently simulated</div>
</div>
</body>
</html>
